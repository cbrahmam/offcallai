# Copy to secrets.yaml, fill in, and apply. Do NOT commit the filled-in copy;
# .gitignore already excludes *secret*.yaml.
#
# Generate the two keys with:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Or create it imperatively instead:
#   kubectl -n offcall-ai create secret generic offcall-secrets \
#     --from-literal=DATABASE_URL=postgresql+asyncpg://... \
#     --from-literal=SECRET_KEY=... \
#     --from-literal=ENCRYPTION_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: offcall-secrets
  namespace: offcall-ai
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://offcall:CHANGE_ME@postgres:5432/offcall_ai"
  REDIS_URL: "redis://redis:6379"
  SECRET_KEY: "CHANGE_ME"
  ENCRYPTION_KEY: "CHANGE_ME"

  # Optional integrations - leave empty to disable.
  CLICKHOUSE_PASSWORD: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  SLACK_BOT_TOKEN: ""
  SLACK_SIGNING_SECRET: ""
  SMTP_PASSWORD: ""
  WEBHOOK_SECRET: ""
---
# Shared ingest key for the agent DaemonSet. Create one under
# Infrastructure -> Install Agent, or POST /api/v1/hosts/api-keys.
apiVersion: v1
kind: Secret
metadata:
  name: offcall-agent-secrets
  namespace: offcall-ai
type: Opaque
stringData:
  api-key: "CHANGE_ME"
