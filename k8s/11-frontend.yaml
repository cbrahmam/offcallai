# The frontend bakes REACT_APP_API_URL in at build time, so build the image
# with your own API URL:
#   docker build --build-arg REACT_APP_API_URL=https://offcall-api.example.com/api/v1 \
#     -t ghcr.io/cbrahmam/offcall-frontend:latest frontend/oncall-frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offcall-frontend
  namespace: offcall-ai
  labels:
    app: offcall-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: offcall-frontend
  template:
    metadata:
      labels:
        app: offcall-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/cbrahmam/offcall-frontend:latest
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: offcall-frontend
  namespace: offcall-ai
spec:
  selector:
    app: offcall-frontend
  ports:
    - port: 80
      targetPort: http
      name: http
