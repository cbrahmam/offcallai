name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: offcall_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration fixtures need PostgreSQL: the models use JSONB and UUID.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/offcall_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/offcall_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-at-least-32-characters-long
      ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars-long
      API_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app

      - name: Verify the migration baseline matches the models
        working-directory: backend
        run: |
          alembic upgrade head
          # A clean baseline leaves nothing for autogenerate to detect.
          alembic revision --autogenerate -m drift-check --rev-id driftcheck
          if grep -qE '^\s+op\.' alembic/versions/driftcheck_drift_check.py; then
            echo "::error::Models have drifted from the migration baseline:"
            cat alembic/versions/driftcheck_drift_check.py
            exit 1
          fi
          rm alembic/versions/driftcheck_drift_check.py

      - name: Test
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/oncall-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/oncall-frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8000/api/v1

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          for f in k8s/*.yaml; do
            kubectl apply --dry-run=client -f "$f"
          done
